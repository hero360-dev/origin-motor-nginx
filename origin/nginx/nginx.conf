user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

# ── RTMP: recibe streams de FFmpeg en puerto 1936 ──────────────────────────
rtmp {
    server {
        listen 1936;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Genera HLS automáticamente
            hls on;
            hls_path /var/lib/nginx-hls;
            hls_fragment 3;
            hls_playlist_length 12;
            hls_nested on;          # un directorio por canal: /tmp/nginx-hls/fx0085/
        }
    }
}

# ── HTTP: sirve HLS en puerto 8090 ────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 8090;
        server_name _;

        # HLS
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /var/lib/nginx-hls;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Estadísticas nginx-rtmp
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/doc/libnginx-mod-rtmp/;
        }

        # Health check
        location /health {
            return 200 'nginx-rtmp OK';
            add_header Content-Type text/plain;
        }
    }
}
