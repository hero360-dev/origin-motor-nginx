user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

# ── RTMP: recibe streams de FFmpeg en puerto 1936 ──────────────────────────
rtmp {
    server {
        listen 1936;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Genera HLS automáticamente
            hls on;
            hls_path /var/lib/nginx-hls;
            hls_fragment 3;
            hls_playlist_length 12;
            hls_nested on;          # un directorio por canal: /tmp/nginx-hls/fx0085/
        }

    # ── Streamers físicos: misma estructura que Wowza ───────────────────────
    # Encoder usa: rtmp://SERVER:1936/fxNNNN/myStream
    # Solo cambia el puerto: 1935 (Wowza) → 1936 (nginx)

    application fx0001 {
        live on;
        record off;
        hls on;
        hls_path /var/lib/nginx-hls/fx0001;
        hls_fragment 3;
        hls_playlist_length 12;
    }
    application fx0002 {
        live on;
        record off;
        hls on;
        hls_path /var/lib/nginx-hls/fx0002;
        hls_fragment 3;
