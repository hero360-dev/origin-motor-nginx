# ─────────────────────────────────────────────────────────────────────────────
# ALTERNATIVA nginx-native: upstream load balancer
# ─────────────────────────────────────────────────────────────────────────────
#
# Si no se quiere lógica en el app server, nginx puede balancear directamente
# usando el módulo upstream con health checks.
#
# Esta config va en el servidor que hace de "balancer front-end".
# NO reemplaza la config de los edges individuales (que siguen igual).
#
# LIMITACIONES de esta alternativa:
#   - No genera token automáticamente (necesita auth_request o Lua)
#   - El balanceo es round-robin o least_conn, no basado en métricas reales
#   - El token debe generarse en un paso separado
# ─────────────────────────────────────────────────────────────────────────────

upstream nginx_edges {
    # Método: least_conn = enviar al edge con menos conexiones activas
    least_conn;

    server 186.233.186.55:80 weight=1 max_fails=3 fail_timeout=30s;
    server 186.233.186.58:80 weight=1 max_fails=3 fail_timeout=30s;
    server 198.147.24.146:80 weight=1 max_fails=3 fail_timeout=30s;

    # keepalive: reutilizar conexiones al backend
    keepalive 16;
}

server {
    listen 80;
    server_name balancer.tudominio.com;

    # Proxy hacia el pool de edges
    # El cliente llama: http://balancer.tudominio.com/01hbx0235c6WI3k/myStream/playlist.m3u8?ngtk=...&ngte=...
    # nginx reenvía la request (con token incluido) al edge seleccionado
    location ~ ^/01hbx([0-9]+)c6WI3k/ {
        proxy_pass http://nginx_edges;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # habilitar keepalive con upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # El token viene en la URL — el edge lo valida
        # NO es necesario re-generar el token aquí si la URL ya lo trae
    }

    # Health check endpoint del balancer
    location /health {
        return 200 "balancer OK";
        add_header Content-Type text/plain;
    }
}

