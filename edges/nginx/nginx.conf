user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls:20m max_size=2g inactive=10m use_temp_path=off;

    server {
        listen 80;
        server_name _;

        # /01hbx0101c6WI3k/myStream/playlist.m3u8
        location ~ ^/01hbx([0-9]+)c6WI3k/myStream/playlist\.m3u8$ {
            set $ch $1;
            proxy_pass http://23.137.84.97:8090/hls/fx${ch}/index.m3u8;
            proxy_http_version 1.1;
            proxy_cache hls;
            proxy_cache_valid 200 206 3s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_cache_key "/hls/fx${ch}/index.m3u8";
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache";
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Served-By edge1;
        }

        # /01hbx0101c6WI3k/myStream/1234.ts
        location ~ ^/01hbx([0-9]+)c6WI3k/myStream/([0-9]+\.ts)$ {
            set $ch $1;
            set $seg $2;
            proxy_pass http://23.137.84.97:8090/hls/fx${ch}/${seg};
            proxy_http_version 1.1;
            proxy_cache hls;
            proxy_cache_valid 200 206 1h;
            proxy_cache_use_stale error timeout;
            proxy_cache_lock on;
            proxy_cache_key "/hls/fx${ch}/${seg}";
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=3600";
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin *;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Served-By edge1;
        }

        location /health {
            return 200 "edge1-nginx OK";
            add_header Content-Type text/plain;
        }

        location / {
            return 404;
        }
    }
}
